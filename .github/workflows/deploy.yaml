name: Deploy to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v3.1.4"
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U setuptools build twine wheel
          python -m pip install -e .

      - name: Verify release tag matches package version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(python setup.py --version)"
          if [ "$tag" != "v$version" ]; then
            echo "Release tag $tag does not match package version $version"
            exit 1
          fi

      - name: Test with unittest
        run: |
          python -m unittest

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Publish package to PyPI
        run: |
          twine upload --skip-existing dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
